name: Rotate TRMNL images

# Redeploys GitHub Pages with the current image for each TRMNL layout.
# TRMNL's Image Display plugin sees the new ETag / Last-Modified and redraws.
on:
  schedule:
    - cron: "7 */6 * * *"  # every 6 hours; keep in step with INTERVAL_HOURS in src/rotate.py
  push:
    branches: [main]
    paths: ["output/trmnl/**", "src/rotate.py", ".github/workflows/trmnl.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Upload and deploy are separate jobs, as in GitHub's Pages starter workflow:
# in one job, deploy-pages sometimes looks up the artifact before it's
# visible and fails with "No artifacts named github-pages".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # rotate.py reads when each patent was added from git history
      - run: python3 src/rotate.py site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
